[package]
name = "peras"
version = "3.2.1"
edition = "2024"
build = "build.rs"
authors = ["FirePlank"]
description = "Peras - a UCI chess engine for 8x8 chess, with an NNUE evaluation and a search adapted from the Apeiron infinite-chess engine. Chess variants behind the `variants` feature."
license = "GPL-3.0-only"
repository = "https://github.com/FirePlank/HydroChess"

[lib]
name = "peras"
path = "src/lib.rs"

[[bin]]
name = "peras"
path = "src/main.rs"

[features]
default = []
# Chess variants (crazyhouse, antichess, three-check, racing kings, king of the hill).
# Without it every variant branch, table and state field is compiled out, so the
# standard binary is byte-for-byte the engine it would be with no variant code at all.
variants = []
# Cycle counters around the network update stages, printed by `bench`.
nnue-profile = []

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.test]
opt-level = 3
debug-assertions = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
